name: Build and Release All Platforms

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_name: OpenBurningSuite-Windows-x64.zip
          - os: macos-latest
            rid: osx-arm64
            artifact_name: OpenBurningSuite-macOS-arm64.zip
          - os: macos-13
            rid: osx-x64
            artifact_name: OpenBurningSuite-macOS-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact_name: OpenBurningSuite-Linux-x64.tar.gz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish App
        run: dotnet publish OpenBurningSuite/OpenBurningSuite.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o ./publish_output

      - name: Zip Package (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path ./publish_output/* -DestinationPath ./${{ matrix.artifact_name }}

      - name: Zip Package (macOS)
        if: startsWith(matrix.os, 'macos')
        run: cd publish_output && zip -r ../${{ matrix.artifact_name }} ./*

      - name: Tar Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cd publish_output && tar -czvf ../${{ matrix.artifact_name }} ./*

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
